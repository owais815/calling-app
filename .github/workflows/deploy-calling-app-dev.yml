name: Deploy Calling App (dev) to VPS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            DEPLOY_DIR=/var/www/lms-calling-dev

            # ── Ensure deploy dir exists and is a git repo ───────────────────
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              mkdir -p "$DEPLOY_DIR"
              git clone https://github.com/owais815/calling-app.git "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            # ── Pull latest dev branch ───────────────────────────────────────
            git fetch origin
            git reset --hard origin/dev 2>/dev/null || git reset --hard origin/main

            # ── Write .env from GitHub Secrets ───────────────────────────────
            cat > .env << 'ENVEOF'
            MEDIASOUP_ANNOUNCED_IP=${{ secrets.MEDIASOUP_ANNOUNCED_IP }}
            CALLING_APP_API_SECRET=${{ secrets.CALLING_APP_API_SECRET }}
            ENVEOF

            # ── Build and restart dev Docker container ───────────────────────
            docker compose -f docker-compose.dev.yml down --remove-orphans || true
            docker rm -f mirotalksfu-dev 2>/dev/null || true
            docker compose -f docker-compose.dev.yml build
            docker compose -f docker-compose.dev.yml up -d

            # ── Clean up dangling images from previous build ─────────────────
            docker image prune -f

            # ── Verify ───────────────────────────────────────────────────────
            echo "Dev container status:"
            docker compose -f docker-compose.dev.yml ps

            echo "Last 20 log lines:"
            docker compose -f docker-compose.dev.yml logs --tail=20
